# Development Docker Compose — local development only
# Starts only PostgreSQL; backend and frontend run via bun dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: saldoo_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: saldoo
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d saldoo"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
