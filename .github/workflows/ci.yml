name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      # Every step runs even after an earlier one fails, so one push reports
      # every problem instead of one per round trip. A failed step still fails
      # the job.
      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: bun run test

      # Its own step because no test above can stand in for it: a controller is resolved at module
      # load, and the container failure that stopped the whole backend from booting is invisible to
      # vitest, whose transform does not emit the decorator metadata bun does. See
      # `apps/backend/scripts/verify-boot.ts`.
      - name: Backend boots
        if: ${{ !cancelled() }}
        env:
          DATABASE_URL: file:./data/ci.db
        run: bun run verify:boot

      # No .env on CI. Every root script passes `--env-file=.env`, which Bun
      # tolerates when the file is absent, and every VITE_* read has a fallback,
      # so the build compiles without secrets. It is a compile gate, not a
      # deployable artifact.
      - name: Build
        if: ${{ !cancelled() }}
        run: bun run build

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A separate job from the unit gate on purpose: a browser failure and a unit
    # failure mean different things, and reading which one broke should not require
    # opening the log.
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - run: bun install --frozen-lockfile

      - run: bun run e2e:install

      - run: bun run e2e

      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
