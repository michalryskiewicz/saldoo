services:
  postgres:
    image: 'postgres:16-alpine'
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_USER: '${POSTGRES_USER:-saldoo_admin}'
      POSTGRES_DB: '${POSTGRES_DB:-saldoo}'
    volumes:
      - 'postgres_data:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saldoo_admin} -d ${POSTGRES_DB:-saldoo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    command: sh -c "bunx prisma migrate deploy && bun run index.ts"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - VITE_SERVER_URL=${VITE_SERVER_URL}
        - VITE_GOOGLE_CLIENT=${VITE_GOOGLE_CLIENT}
        - VITE_GA_ID=${VITE_GA_ID}
        - VITE_GA_DRIVE_DIRECTORY=${VITE_GA_DRIVE_DIRECTORY}
        - VITE_GA_DRIVE_FILE=${VITE_GA_DRIVE_FILE}
        - VITE_ASSETS_DIR=${VITE_ASSETS_DIR}
        - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID}
        - VITE_UMAMI_SRC=${VITE_UMAMI_SRC}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  postgres_data: null