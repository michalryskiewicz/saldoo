server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache static assets. The =404 matters: without it the SPA fallback below
    # answers a missing hashed asset with index.html at 200, and `immutable` pins
    # that HTML in every cache between here and the user for a year.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;

        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — all routes go to index.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;

        # The document names the hashed assets, so a cached copy outlives the very
        # deploy that replaced them.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
